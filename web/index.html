<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>법친 — 친구처럼 편한 법률 친구</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="logo">⚖️</span>
        <span class="brand-name">법친</span>
      </div>
      <button class="new-chat-btn" id="newChatBtn" type="button">+ 새 대화</button>
    </div>
    <div class="session-list" id="sessionList"></div>
    <div class="sidebar-footer">친구처럼 편하게 물어봐</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="chat-title" id="chatTitle">새 대화</div>
      <div class="cli-picker" id="cliPicker">
        <span class="cli-label">엔진</span>
        <button type="button" data-cli="claude" class="cli-btn">Claude</button>
        <button type="button" data-cli="codex" class="cli-btn">Codex</button>
      </div>
    </header>

    <main id="chat" class="chat">
      <div class="message assistant intro">
        <div class="bubble">
          안녕! 나는 <strong>법친</strong>이야 👋<br />
          법 때문에 헷갈리거나 답답한 일이 있으면 편하게 물어봐.<br />
          어떤 상황인지 그냥 말로 풀어줘도 돼.
        </div>
      </div>
    </main>

    <div class="composer-area">
      <div class="readonly-banner hidden" id="readonlyBanner">
        <span>📁 이 대화는 보관된 대화예요. 이어서 물어볼 수는 없지만, 다시 읽어볼 수 있어요.</span>
        <button type="button" id="startNewFromArchive">새 대화 시작</button>
      </div>
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" rows="2" placeholder="예) 전세 보증금을 집주인이 안 돌려주는데 어떡하지?"></textarea>
        <button type="submit" id="sendBtn">보내기</button>
      </form>
      <div class="disclaimer">
        ⚖️ 법친은 일반적인 법률 <strong>정보</strong>를 제공해요. 변호사의 법률 자문이 아니에요. 실제 사건은 꼭 변호사와 상담하세요.
      </div>
    </div>
  </div>

  <div id="precedentModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
